<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>منصة المنظمين</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#17172b;--mu:#6c6f87;--br:#e6e4f0;--ac:#7c3aed;--acx:#fff;--soft:#f1ebff;--ok:#16a34a;--no:#dc2626;--wa:#d97706;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--soft),var(--bg) 280px) no-repeat var(--bg);color:var(--tx);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 calc(86px + env(safe-area-inset-bottom,0))}
.w{max-width:640px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 10px}.top h1{flex:1;margin:0;font-size:22px}
.bell{background:none;border:0;font:inherit;font-size:20px;padding:6px;position:relative;color:var(--tx)}
.bell i{position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;background:var(--no)}
h2{font-size:18px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}h2 a{font-size:13px;color:var(--mu);font-weight:400}
.card,.ev,.stats3{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(80,50,160,.08);animation:up .4s ease both}
.card h3{margin:0 0 2px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--br);color:var(--mu)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px}.chips .chip{white-space:nowrap;padding:6px 14px;font-size:13px;cursor:pointer}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.tag.pending{color:var(--wa)}.tag.accepted{color:var(--ok)}.tag.rejected{color:var(--no)}.tag.closed{color:var(--mu)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--br);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.btn{padding:12px 16px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:transform .15s}
.btn:active,.ev:active{transform:scale(.97)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--br)}
.btn.s{padding:7px 12px;font-size:13px}.btn.f{width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.lgs{background:linear-gradient(135deg,#6d28d9,#a855f7)!important;color:#fff;font:800 26px/1 Georgia,"Times New Roman",serif}
.ph{display:flex;gap:12px;align-items:center}
.ap{border-top:1px dashed var(--br);padding-top:10px;margin-top:10px}.ap .av{width:42px;height:42px;font-size:17px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px}
.car .ev{flex:none;width:78%;scroll-snap-align:start;margin-bottom:0}
.ev{padding:10px;border-radius:20px;cursor:pointer}
.cv{width:100%;aspect-ratio:16/9;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,#7c3aed,#f472b6);display:flex;align-items:center;justify-content:center;font:800 44px Georgia,serif;color:#fff;margin-bottom:8px}
.ev b{display:block;font-size:16px}
.hero{background:var(--soft);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center}.hero .ic{font-size:50px}.hero h3{margin:0;color:var(--ac)}
.tm{font-size:34px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums;text-align:center;margin:6px 0}
.stats3{display:flex;padding:14px 4px}.stats3>div{flex:1;text-align:center;border-inline-start:1px solid var(--br)}.stats3>div:first-child{border:0}
.stats3 b{display:block;font-size:24px;color:var(--ac)}.stats3 span{font-size:12px;color:var(--mu)}
.pf{background:var(--soft);border-radius:22px;padding:56px 16px 16px;text-align:center;margin-top:44px;position:relative}
.pf .av{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:92px;height:92px;font-size:36px;border:4px solid #fff}
.lv{border-radius:22px;padding:16px;margin-bottom:14px;color:#2a1a0d}
.bar{height:10px;background:rgba(0,0,0,.15);border-radius:9px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:#2a1a0d;border-radius:9px}
.bn{background:linear-gradient(135deg,#6d28d9,#a855f7 60%,#ec4899);color:#fff;border-radius:26px;padding:18px;margin:6px 0 14px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(124,58,237,.35)}
.bn:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);top:-50px;left:-40px}
.bn h3{margin:0 0 2px;font-size:19px}.bn .n{display:flex;gap:22px;margin-top:12px}.bn b{font-size:24px;display:block;line-height:1.2}.bn span{font-size:12px;opacity:.9}
.empty{text-align:center;color:var(--mu);padding:34px 0}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--br);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(80,50,160,.10);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:10.5px;padding:4px 0;display:flex;flex-direction:column;align-items:center}
.nav button span{padding:3px 18px;border-radius:14px;display:flex;transition:.2s}.nav button.on{color:var(--ac);font-weight:700}.nav button.on span{background:var(--soft)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow-y:auto;margin:0 auto;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0))}
.lg{width:110px;height:110px;border-radius:32px;background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;font:800 66px/1 Georgia,"Times New Roman",serif;box-shadow:0 16px 34px rgba(124,58,237,.35);animation:pop .7s ease both;margin:0 auto 14px}
#splash{position:fixed;inset:0;z-index:99;background:#fff;color:#4c1d95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}#splash h1{margin:0;font-size:26px}#splash p{margin:0;opacity:.8}
.auth{max-width:420px;margin:0 auto;padding-top:48px;text-align:center}.auth h1{margin:0 0 4px}.auth .card{text-align:right;margin-top:18px}
.err{color:var(--no);font-size:13px;min-height:20px;margin:0 0 8px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="splash"><div class="lg">R</div><h1>أهلاً وسهلاً</h1><p>منصة المنظمين</p></div>
<div class="w"><div id="view"></div></div>
<div class="nav" id="nav" style="display:none"></div>
<div id="sheet"></div>
<script type="module">
const _db=await window.claude.use('db'),_us=await window.claude.use('user');
const _uid=_us?await _us.id():null,_own=_us?_us.isOwner():false;
const db={},auth={currentUser:{uid:_uid,email:'حسابك في Claude'}};
const collection=(_,c)=>({_c:c,_k:[]}),doc=(_,c,id)=>({_c:c,_id:id});
const where=(f,o,v)=>({w:[f,o,v]}),orderBy=(f,d)=>({o:[f,d]}),serverTimestamp=()=>Date.now();
const query=(c,...k)=>({_c:c._c,_k:k});
const _col=r=>_db.collection(r._c),_dr=r=>_db.collection(r._c).doc(r._id);
const setDoc=(r,d)=>_dr(r).set(d),updateDoc=(r,d)=>_dr(r).update(d),deleteDoc=r=>_dr(r).delete(),addDoc=(r,d)=>_col(r).add(d);
const getDoc=async r=>({exists:()=>r._c==='admins'?_own:false});
const onSnapshot=(r,fn,er)=>{
  if(r._id)return _dr(r).onSnapshot(s=>fn({exists:()=>s.exists,data:()=>s.data(),id:s.id}),er);
  let q=_col(r);(r._k||[]).forEach(k=>{if(k.w)q=q.where(...k.w);if(k.o)q=q.orderBy(...k.o)});
  return q.onSnapshot(fn,er)};
const onAuthStateChanged=(a,cb)=>cb(_uid?{uid:_uid}:null),signOut=async()=>{};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={pending:'قيد المراجعة',accepted:'مقبول',rejected:'مرفوض'};
const CATS=['حفلات','مؤتمرات','معارض','رياضية','أفراح','أخرى'];
const SK=['استقبال','تنسيق','تصوير','إدارة حشود','لوجستيات','تسويق','ضيافة','تقني'];
const LV=[{n:'مبتدئ',m:0,c:'#e2e8f0,#cbd5e1'},{n:'برونزي',m:50,c:'#f6e3d3,#e6b48a'},{n:'فضي',m:125,c:'#f1f5f9,#b6c0cf'},{n:'ذهبي',m:250,c:'#fff3c4,#f2c744'}];
const sv=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const IC={home:sv('<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),explore:sv('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'),mine:sv('<path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 5v14" stroke-dasharray="2 3"/>'),time:sv('<path d="M5 20V11M12 20V4M19 20v-6"/>'),profile:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),add:sv('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'),people:sv('<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5 7-5s7 1.5 7 5M17 4.5a3.5 3.5 0 0 1 0 7M22 20c0-2.5-1.5-4-4-4.6"/>')};
let uid=null,admin=false,tab='home',projects=[],profiles={},apps=[],sess=[],unsubs=[],dPhoto=null,dCover=null,q='',cat='',skSel=null,edit=false,mode='in';

const av=p=>p&&p.photo?`<img class="av" src="${esc(p.photo)}" alt="">`:`<div class="av">👤</div>`;
const me=()=>profiles[uid]||null;
const nAcc=pid=>apps.filter(a=>a.pid===pid&&a.status==='accepted').length;
const hrs=u=>sess.filter(s=>s.uid===u&&s.end).reduce((t,s)=>t+(s.end-s.start)/36e5,0);
const rate=u=>{const r=apps.filter(a=>a.uid===u&&a.rating>0);return r.length?r.reduce((t,a)=>t+a.rating,0)/r.length:0};
const active=()=>sess.find(s=>s.uid===uid&&!s.end);
const mid=u=>String(Math.abs([...u].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7))).slice(0,4);
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000)),p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)};
const ms=t=>t&&t.toMillis?t.toMillis():(typeof t==='number'?t:0);

function authView(msg){
  $('#nav').style.display='none';
  $('#view').innerHTML=`<div class="auth"><div class="lg">R</div><h1>أهلاً وسهلاً</h1><div class="mu">منصة المنظمين</div>
  <div class="card"><div class="chips"><span class="chip ${mode==='in'?'on':''}" data-mode="in">تسجيل الدخول</span><span class="chip ${mode==='up'?'on':''}" data-mode="up">حساب جديد</span></div>
  <label>البريد الإلكتروني</label><input id="em" type="email" inputmode="email" autocomplete="email" dir="ltr">
  <label>كلمة السر (6 أحرف على الأقل)</label><input id="pw" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" dir="ltr">
  <div class="err" id="err">${msg||''}</div>
  <button class="btn f" data-act="auth">${mode==='in'?'دخول':'إنشاء حساب'}</button>
  ${mode==='in'?'<div class="row" style="justify-content:center"><button class="btn g s" data-act="reset">نسيت كلمة السر؟</button></div>':''}</div></div>`;
}
const AE={'auth/invalid-credential':'الإيميل أو كلمة السر غير صحيحة','auth/invalid-email':'الإيميل غير صحيح','auth/email-already-in-use':'هذا الإيميل مسجل من قبل','auth/weak-password':'كلمة السر ضعيفة (6 أحرف على الأقل)','auth/missing-password':'اكتب كلمة السر','auth/too-many-requests':'محاولات كثيرة، جرّب بعد قليل','auth/network-request-failed':'تحقق من الاتصال بالإنترنت'};

function nav(){
  const t=admin?[['home','الفعاليات'],['add','فعالية جديدة'],['people','المنظمين']]:[['home','الرئيسية'],['explore','إستكشاف'],['mine','فعالياتي'],['time','سجل التوقيت'],['profile','الملف الشخصي']];
  const n=$('#nav');n.style.display='flex';
  n.innerHTML=t.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}"><span>${IC[k]}</span>${l}</button>`).join('');
}
function topbar(title){
  const left=admin?`<button class="bell" data-act="out">خروج</button>`:`<button class="bell" data-bell="1">🔔${apps.some(a=>a.uid===uid&&a.status!=='pending')?'<i></i>':''}</button>`;
  if(title)return `<div class="top"><h1>${title}</h1>${left}</div>`;
  return `<div class="top">${admin?'<div class="av lgs">R</div>':av(me())}<h1>${admin?'لوحة المشرف':esc(me()?me().name:'أهلاً بك')}</h1>${left}</div>`;
}
function render(){
  if(!uid)return;nav();const v=$('#view');
  if(admin){
    if(tab==='home')v.innerHTML=topbar()+adminStats()+filters()+'<div id="list">'+list()+'</div>';
    else if(tab==='add')v.innerHTML=topbar('فعالية جديدة')+addForm();
    else v.innerHTML=topbar('المنظمين')+people();return;
  }
  if(tab==='home')v.innerHTML=topbar()+`<input id="q" placeholder="🔍 ما هي الفعالية التي تبحث عنها ..." value="${esc(q)}">`+banner()+timeCard()+`<h2>الفعاليات المتاحة <a href="#" data-tab="explore">إظهار الكل</a></h2>`+carousel();
  else if(tab==='explore')v.innerHTML=topbar('إستكشاف')+filters()+'<div id="list">'+list()+'</div>';
  else if(tab==='mine')v.innerHTML=topbar('فعالياتي')+mine();
  else if(tab==='time')v.innerHTML=topbar('سجل التوقيت')+timeLog();
  else v.innerHTML=topbar('الملف الشخصي')+profile();
}
function banner(){const m=me(),o=projects.filter(p=>!p.closed).length,ev=apps.filter(a=>a.uid===uid&&a.status==='accepted').length;
  return `<div class="bn"><h3>${m?'أهلاً وسهلاً '+esc(m.name.split(' ')[0])+' 👋':'أهلاً وسهلاً بك 👋'}</h3><div style="font-size:13px;opacity:.92">${m?'جاهز لفعالية جديدة اليوم؟':'أنشئ ملفك وابدأ التقديم على الفعاليات'}</div><div class="n"><div><b>${o}</b><span>فعالية متاحة</span></div><div><b>${ev}</b><span>مقبولة</span></div><div><b>${hrs(uid).toFixed(0)}</b><span>ساعة</span></div></div></div>`}
function adminStats(){const s=[[projects.length,'فعاليات'],[apps.filter(a=>a.status==='pending').length,'طلبات جديدة'],[Object.keys(profiles).length,'منظمين']];
  return `<div class="stats3">${s.map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join('')}</div>`}
function filters(){return `<input id="q" placeholder="🔍 ابحث..." value="${esc(q)}"><div class="chips"><span class="chip ${cat?'':'on'}" data-cat="">الكل</span>${CATS.map(c=>`<span class="chip ${cat===c?'on':''}" data-cat="${c}">${c}</span>`).join('')}</div>`}
function list(){const ps=projects.filter(p=>(!cat||p.cat===cat)&&(!q||(p.title+p.desc+p.place).includes(q)));
  return ps.length?ps.map(admin?adminCard:evCard).join(''):'<div class="empty">ما فيه فعاليات مطابقة</div>'}
const cover=p=>p.cover?`<img class="cv" src="${esc(p.cover)}" alt="">`:`<div class="cv">R</div>`;
const chips=p=>`<div class="meta">${p.cat?`<span class="chip">🏷 ${esc(p.cat)}</span>`:''}${p.date?`<span class="chip">📅 ${esc(p.date)}</span>`:''}${p.place?`<span class="chip">📍 ${esc(p.place)}</span>`:''}${p.pay?`<span class="chip">💰 ${esc(p.pay)}</span>`:''}${p.need?`<span class="chip">👥 ${admin?nAcc(p.id)+'/':''}${p.need}</span>`:''}</div>`;
const evCard=p=>`<div class="ev" data-open="${p.id}">${cover(p)}<b>${esc(p.title)} ${p.closed?'<span class="tag closed">مغلق</span>':''}</b>${chips(p)}</div>`;
function carousel(){const ps=projects.filter(p=>!p.closed&&(!q||(p.title+p.desc+p.place).includes(q)));
  return `<div id="cl">${ps.length?`<div class="car">${ps.map(evCard).join('')}</div>`:'<div class="empty">ما فيه فعاليات متاحة حالياً</div>'}</div>`}
function timeCard(){
  const a=active();
  if(a){const p=projects.find(x=>x.id===a.pid)||{};return `<h2>تتبع الوقت</h2><div class="card"><div class="mu">دوام جاري: ${esc(p.title)}</div><div class="tm" id="tm">${fmt(Date.now()-a.start)}</div><button class="btn no f" data-out="${a.id}">⏹ إنهاء الدوام</button></div>`}
  const ok=apps.filter(x=>x.uid===uid&&x.status==='accepted').map(x=>projects.find(p=>p.id===x.pid)).filter(Boolean);
  if(ok.length)return `<h2>تتبع الوقت</h2><div class="card"><div class="mu">اختر الفعالية لبدء الدوام</div>${ok.map(p=>`<div class="row"><b style="flex:1">${esc(p.title)}</b><button class="btn s" data-in="${p.id}">▶ ابدأ</button></div>`).join('')}</div>`;
  return `<h2>تتبع الوقت</h2><div class="hero"><div class="ic">⏳</div><div><h3>لا يوجد فعالية جارية بعد!</h3><div class="mu">بمجرد قبولك في فعالية، يمكنك تتبع ساعات عملك من هنا.</div></div></div>`;
}
function mine(){const m=apps.filter(a=>a.uid===uid);if(!m.length)return '<div class="empty">ما قدمت على أي فعالية بعد</div>';
  return m.map(a=>{const p=projects.find(x=>x.id===a.pid);return p?`<div class="ev" data-open="${p.id}">${cover(p)}<b>${esc(p.title)}</b>${chips(p)}<span class="tag ${a.status}">${ST[a.status]}</span> ${a.rating?`<span class="chip">⭐ ${a.rating}</span>`:''}</div>`:''}).join('')}
function timeLog(){const my=sess.filter(s=>s.uid===uid&&s.end).sort((a,b)=>b.start-a.start);
  return `<div class="stats3"><div><b>${hrs(uid).toFixed(1)}</b><span>إجمالي الساعات</span></div><div><b>${my.length}</b><span>الدوامات</span></div></div>`+
  (my.length?my.map(s=>{const p=projects.find(x=>x.id===s.pid)||{};return `<div class="card"><b>${esc(p.title||'فعالية')}</b><div class="mu">${new Date(s.start).toLocaleDateString('ar')} · ${((s.end-s.start)/36e5).toFixed(2)} ساعة</div></div>`}).join(''):'<div class="empty">لا يوجد سجل دوام بعد</div>')}
function profile(){
  const p=me()||{},h=hrs(uid),r=rate(uid),ev=apps.filter(a=>a.uid===uid&&a.status==='accepted').length;
  let i=0;LV.forEach((l,k)=>{if(h>=l.m)i=k});const l=LV[i],nx=LV[i+1];const pc=nx?Math.min(100,Math.round((h-l.m)/(nx.m-l.m)*100)):100;
  const ph=dPhoto||p.photo;if(!skSel)skSel=[...(p.skills||[])];
  const card=`<div class="pf">${ph?`<img class="av" src="${esc(ph)}" alt="">`:'<div class="av">👤</div>'}<h3 style="margin:0">${esc(p.name||'أكمل ملفك')}</h3><div class="mu">${esc(p.city)} ${p.phone?'· '+esc(p.phone):''}</div><div class="mu">رقم المعرف: ${mid(uid)}</div>
  ${(p.skills||[]).length?`<div class="meta" style="justify-content:center">${p.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center"><button class="btn g s" data-edit="1">✏️ ${edit?'إغلاق':'تعديل الملف'}</button></div></div>`;
  const st=`<div class="stats3" style="margin-top:14px"><div><b>${ev}</b><span>الفعاليات</span></div><div><b>${h.toFixed(1)} س</b><span>إجمالي الساعات</span></div><div><b>${r?r.toFixed(1)+' ⭐':'—'}</b><span>التقييم</span></div></div>`;
  const lvc=`<div class="lv" style="background:linear-gradient(135deg,${l.c})"><b style="font-size:18px">🏅 المستوى: ${l.n}</b><div class="bar"><i style="width:${pc}%"></i></div><div style="font-size:13px">${nx?`باقي ${(nx.m-h).toFixed(1)} ساعة لتصبح ${nx.n}`:'وصلت لأعلى مستوى 🎉'}</div></div>`;
  const f=edit?`<div class="card"><label class="btn g s" style="cursor:pointer">📷 اختر صورة<input type="file" id="pf" accept="image/*" hidden></label><br><br>
  <label>الاسم الكامل</label><input id="f_name" value="${esc(p.name)}"><label>رقم الجوال (مع رمز الدولة)</label><input id="f_phone" inputmode="tel" value="${esc(p.phone)}">
  <label>المدينة</label><input id="f_city" value="${esc(p.city)}"><label>المهارات</label><div class="chips" style="flex-wrap:wrap">${SK.map(s=>`<span class="chip ${skSel.includes(s)?'on':''}" data-sk="${s}">${s}</span>`).join('')}</div>
  <label>نبذة عنك</label><textarea id="f_bio" rows="3">${esc(p.bio)}</textarea><button class="btn f" data-act="saveProfile">حفظ</button><div class="mu" id="msg" style="text-align:center"></div></div>`:'';
  const acc=`<div class="card"><div class="mu">${esc(auth.currentUser.email)}</div><div class="mu" style="margin:6px 0">معرّف الحساب (UID): <b dir="ltr" style="user-select:all;word-break:break-all">${uid}</b></div><button class="btn g s" data-act="out">تسجيل الخروج</button></div>`;
  return card+st+lvc+f+acc;
}
function adminCard(p){
  const as=apps.filter(a=>a.pid===p.id);
  const rows=as.map(a=>{const o=profiles[a.uid]||{};const ph=String(o.phone||'').replace(/\D/g,'');
    return `<div class="ap"><div class="ph">${av(o)}<div style="flex:1"><b>${esc(o.name||'بدون اسم')}</b> <span class="tag ${a.status}">${ST[a.status]}</span><div class="mu">${esc(o.city)} · ${hrs(a.uid).toFixed(1)} س ${rate(a.uid)?'· ⭐ '+rate(a.uid).toFixed(1):''}</div></div></div>
    ${(o.skills||[]).length?`<div class="meta">${o.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}${o.bio?`<div class="mu">${esc(o.bio)}</div>`:''}${a.msg?`<div class="mu">💬 ${esc(a.msg)}</div>`:''}
    <div class="row"><button class="btn ok s" data-set="${a.id}|accepted">قبول</button><button class="btn no s" data-set="${a.id}|rejected">رفض</button>
    ${a.status==='accepted'?`<select data-rate="${a.id}" style="width:auto;margin:0;padding:6px"><option value="0">تقييم</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${a.rating===n?'selected':''}>${'⭐'.repeat(n)}</option>`).join('')}</select>`:''}
    ${ph?`<a class="btn g s" href="tel:${ph}">📞</a><a class="btn g s" target="_blank" href="https://wa.me/${ph}">واتساب</a>`:''}</div></div>`}).join('');
  return `<div class="card">${cover(p)}<h3>${esc(p.title)} ${p.closed?'<span class="tag closed">مغلق</span>':''}</h3>${chips(p)}<b>${as.length} طلب</b>${rows}
  <div class="row"><button class="btn g s" data-close="${p.id}">${p.closed?'فتح التقديم':'إغلاق التقديم'}</button><button class="btn g s" data-del="${p.id}">حذف</button></div></div>`;
}
function addForm(){return `<div class="card"><label class="btn g s" style="cursor:pointer">🖼 صورة الفعالية (بوستر)<input type="file" id="cvf" accept="image/*" hidden></label><div id="cvp" style="margin-top:8px"></div><br>
  <label>اسم الفعالية</label><input id="n_title"><label>الوصف</label><textarea id="n_desc" rows="3"></textarea>
  <label>التصنيف</label><select id="n_cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
  <label>التاريخ</label><input id="n_date" placeholder="مثال: 18 أكتوبر 2026"><label>المكان</label><input id="n_place">
  <label>الأجر</label><input id="n_pay"><label>عدد المنظمين المطلوب</label><input id="n_need" type="number" inputmode="numeric">
  <button class="btn f" data-act="addProject">نشر الفعالية</button></div>`}
function people(){const ids=Object.keys(profiles);if(!ids.length)return '<div class="empty">ما سجّل أي منظم بعد</div>';
  return ids.map(i=>{const o=profiles[i];return `<div class="card"><div class="ph">${av(o)}<div><b>${esc(o.name)}</b><div class="mu">${esc(o.city)} · ${hrs(i).toFixed(1)} ساعة · ${rate(i)?'⭐ '+rate(i).toFixed(1):'بدون تقييم'}</div></div></div>${o.bio?`<div class="mu">${esc(o.bio)}</div>`:''}</div>`}).join('')}
function sheet(h){$('#sheet').innerHTML=`<div class="sheet" data-x="1"><div>${h}<button class="btn g f" style="margin-top:8px" data-x="1">إغلاق</button></div></div>`}
function openEv(pid){
  const p=projects.find(x=>x.id===pid);if(!p)return;const a=apps.find(x=>x.pid===pid&&x.uid===uid);let act='';
  if(!admin){
    if(a)act=`<span class="tag ${a.status}">${ST[a.status]}</span>`+(a.status==='pending'?` <button class="btn g s" data-wd="${a.id}">سحب الطلب</button>`:'');
    else if(p.closed)act='<div class="mu">التقديم مغلق</div>';
    else act=`<label>رسالة للمشرف (اختياري)</label><textarea id="a_msg" rows="2"></textarea><button class="btn f" data-send="${pid}">قدّم على الفعالية</button>`;
  }
  sheet(`${cover(p)}<h3 style="margin:0">${esc(p.title)}</h3>${chips(p)}<div class="mu" style="margin-bottom:10px">${esc(p.desc)}</div>${act}`);
}
function bell(){const m=apps.filter(a=>a.uid===uid&&a.status!=='pending');
  sheet('<h3 style="margin:0 0 10px">🔔 الإشعارات</h3>'+(m.length?m.map(a=>{const p=projects.find(x=>x.id===a.pid);return p?`<div class="card">${a.status==='accepted'?'✅ تم قبولك في':'❌ تم رفض طلبك في'} <b>${esc(p.title)}</b></div>`:''}).join(''):'<div class="empty">لا توجد إشعارات</div>'))}
function resize(file,w,h){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const k=Math.max(w/img.width,h/img.height),sw=w/k,sh=h/k;
  c.getContext('2d').drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=u})}

function listen(){
  const on=(qr,fn)=>unsubs.push(onSnapshot(qr,s=>{fn(s);render()},e=>console.warn(e.code)));
  const me_=where('uid','==',uid);
  on(query(collection(db,'projects'),orderBy('at','desc')),s=>projects=s.docs.map(d=>({id:d.id,...d.data()})));
  on(admin?collection(db,'profiles'):doc(db,'profiles',uid),s=>{profiles={};if(s.docs)s.docs.forEach(d=>profiles[d.id]=d.data());else if(s.exists())profiles[uid]=s.data()});
  on(admin?collection(db,'applications'):query(collection(db,'applications'),me_),s=>apps=s.docs.map(d=>({id:d.id,...d.data()})));
  on(admin?collection(db,'sessions'):query(collection(db,'sessions'),me_),s=>sess=s.docs.map(d=>{const x=d.data();return {id:d.id,...x,start:ms(x.start)||Date.now(),end:ms(x.end)}}));
}
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];projects=[];profiles={};apps=[];sess=[];
  if(!u||!_db){uid=null;admin=false;$('#nav').style.display='none';$('#view').innerHTML='<div class="empty">سجّل دخولك بحساب Claude لفتح المنصة</div>';return}
  uid=u.uid;
  try{admin=_own}catch(_){admin=false}
  tab='home';listen();render();
});

document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim();const l=$('#list');if(l)l.innerHTML=list();else{const c=$('#cl');if(c)c.outerHTML=carousel()}}});
document.addEventListener('change',async e=>{const t=e.target;
  try{
    if(t.id==='pf'&&t.files[0]){dPhoto=await resize(t.files[0],240,240);render()}
    if(t.id==='cvf'&&t.files[0]){dCover=await resize(t.files[0],640,360);$('#cvp').innerHTML=`<img class="cv" src="${dCover}" alt="">`}
    if(t.dataset.rate)await updateDoc(doc(db,'applications',t.dataset.rate),{rating:+t.value});
  }catch(_){}});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-cat],[data-sk],[data-x],[data-open],[data-mode],button');if(!t)return;const d=t.dataset;
  try{
    if(d.x){if(e.target===t||t.tagName==='BUTTON')$('#sheet').innerHTML='';return}
    if(d.mode){mode=d.mode;authView();return}
    if(d.tab){e.preventDefault();tab=d.tab;render();return}
    if(d.bell){bell();return}
    if(d.open){openEv(d.open);return}
    if(d.cat!==undefined){cat=d.cat;render();return}
    if(d.sk){const i=skSel.indexOf(d.sk);i<0?skSel.push(d.sk):skSel.splice(i,1);t.classList.toggle('on');return}
    if(d.edit){edit=!edit;render();return}
    if(d.send){if(!me()){$('#sheet').innerHTML='';tab='profile';edit=true;render();alert('أكمل ملفك الشخصي أولاً');return}
      t.disabled=true;const pid=d.send;await setDoc(doc(db,'applications',pid+'_'+uid),{pid,uid,status:'pending',msg:$('#a_msg').value.trim(),at:Date.now()});$('#sheet').innerHTML='';return}
    if(d.wd){if(confirm('سحب الطلب؟')){await deleteDoc(doc(db,'applications',d.wd));$('#sheet').innerHTML=''}return}
    if(d.set){const [id,st]=d.set.split('|');await updateDoc(doc(db,'applications',id),{status:st});return}
    if(d.close){const p=projects.find(x=>x.id===d.close);await updateDoc(doc(db,'projects',d.close),{closed:!p.closed});return}
    if(d.del){if(confirm('حذف هذه الفعالية؟'))await deleteDoc(doc(db,'projects',d.del));return}
    if(d.in){t.disabled=true;await setDoc(doc(db,'sessions',uid+'_'+Date.now()),{uid,pid:d.in,start:serverTimestamp(),end:0});return}
    if(d.out){await updateDoc(doc(db,'sessions',d.out),{end:serverTimestamp()});return}
    if(d.act==='auth'){
      const em=$('#em').value.trim(),pw=$('#pw').value;t.disabled=true;
      try{mode==='in'?await signInWithEmailAndPassword(auth,em,pw):await createUserWithEmailAndPassword(auth,em,pw)}
      catch(er){authView(AE[er.code]||'تعذّر تنفيذ العملية، حاول مرة ثانية')}return}
    if(d.act==='reset'){const em=$('#em').value.trim();if(!em){$('#err').textContent='اكتب إيميلك أولاً';return}
      try{await sendPasswordResetEmail(auth,em);$('#err').style.color='var(--ok)';$('#err').textContent='أرسلنا لك رابط إعادة تعيين كلمة السر'}catch(er){$('#err').textContent=AE[er.code]||'تعذّر الإرسال'}return}
    if(d.act==='out'){await signOut(auth);return}
    if(d.act==='saveProfile'){const name=$('#f_name').value.trim();if(!name){$('#msg').textContent='اكتب اسمك';return}
      await setDoc(doc(db,'profiles',uid),{name,phone:$('#f_phone').value.trim(),city:$('#f_city').value.trim(),bio:$('#f_bio').value.trim(),skills:skSel,photo:dPhoto||(me()||{}).photo||''});
      dPhoto=null;edit=false;skSel=null;render();return}
    if(d.act==='addProject'){const title=$('#n_title').value.trim();if(!title)return;
      await addDoc(collection(db,'projects'),{title,desc:$('#n_desc').value.trim(),cat:$('#n_cat').value,date:$('#n_date').value.trim(),place:$('#n_place').value.trim(),pay:$('#n_pay').value.trim(),need:+$('#n_need').value||0,cover:dCover||'',closed:false,at:Date.now()});
      dCover=null;tab='home';render();return}
  }catch(err){alert('تعذّر تنفيذ العملية: '+(err&&err.message||''));t.disabled=false}
});
setInterval(()=>{const a=uid?active():null,e=$('#tm');if(a&&e)e.textContent=fmt(Date.now()-a.start)},1000);
setTimeout(()=>$('#splash').classList.add('hide'),1300);
</script>
</body>
</html>
